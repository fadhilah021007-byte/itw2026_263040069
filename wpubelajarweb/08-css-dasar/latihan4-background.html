<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan4 background</title>
     <style>
        body {
          background-color: rgb(61, 53, 53);
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: rgb(61, 61, 61);
      text-align: center;
      background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.9), rgba(15, 23, 43, 0.4)), url(https://fastly.picsum.photos/id/10/1000/1000.jpg?hmac=8imXWM_Cxe6_cWjyUbT2Vh7oxwiz12HfzJHp6CLoGwM);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;

    }

    h1{
      color: rgb(33, 74, 187);
     font-size: 4em;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      /* text-shadow: 5px 5px 2px rgb(255 255 255 / 10%); */
      background-image: linear-gradient(to right, rgb(34, 163, 255) 20%, rgb(238, 80, 233));
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(121, 228, 252, 0.5));
    }
 span {
       color: crimson;
      text-decoration: none;
      text-shadow: 0 0 10px rgb(248, 50, 89)
    }
    .quote {
      color:white;
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
      background-color: rgba(255, 255, 255, 0.05);
      max-width: 600px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      
    }
    .artist {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(151, 151, 151, 0.7);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      width: 30%;
      margin: 30px auto;
      padding-top: 20px;
    }
      
    </style>
</head>
<body>
    <h1>RUNTUH</h1>
    <p class="quote">"Tak perlu khawatir, ku hanya <span>terluka</span>. terbiasa tuk pura pura tertawa. namun bolehkah sekali saja ku menangis? sebelum kembali membohongi diri."</p>
    <p class="artist">-feby putri feat. fiersa besari-</p>
</body>
</html>
