<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan2 text font style</title>
     <style>
        body {
            background-color: rgb(46, 41, 41);
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: rgb(61, 61, 61);
      text-align: center;
    }

    h1{
        color: rgb(84, 164, 238);
     font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(126, 100, 100);
      text-shadow: 5px 5px 2px rgb(6, 50, 100);
    }
 span {
      color: rgb(241, 27, 27);
      text-decoration: line-through;
    }
    .quote {
      font-size: 24px;
      line-height: 2.2;
      word-spacing: 5px;
      color: rgb(255, 255, 255);
    }
    .artist {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(158, 158, 158);
      font-weight: normal;
    }
    </style>
</head>
<body>
    <h1>RUNTUH</h1>
    <p class="quote">"Tak perlu khawatir, ku hanya <span>terluka</span>. terbiasa tuk pura pura tertawa. namun bolehkah sekali saja ku menangis? sebelum kembali membohongi diri."</p>
    <p class="artist">-feby putri feat. fiersa besari-</p>
</body>
</html>
