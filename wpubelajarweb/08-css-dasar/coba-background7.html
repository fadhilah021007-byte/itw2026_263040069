<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Backgrounds</title>
    <style>
        body{
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color:#333;
        }

        .frame
        {
            width: 400px;
            height: 400px;
            border:10px solid #fff;
            margin:auto;
            background-image: url(fonts/img/Bernadya-RB.png) , url(fonts/img/gunung.jpg);
            Background-size: 100% 100%, 400px 400px;
            background-repeat: no-repeat, no-repeat;
            background-position: center bottom, center 70%;
            background-color:#f0f0f0;
            border-radius: 50%;
        }

        h1{color:#fff;
        text-align:center;
        font-family: "courier new", Courier, monospace;
        font-size:40px;
        text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <h1>Multiple Backgrounds</h1>
    <div class="frame"></div>
</body>
</html>
