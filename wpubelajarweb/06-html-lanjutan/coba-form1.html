<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Element Form</title>
</head>
<body>
    <h1>Contoh Element-element Form pada HTML</h1>

    <form>
<label for="nama">Nama :
        <input type="text" name="nama" id="nama" placeholder="Masukkan Nama Anda">
        <br>
        <label for="password">Password :
        <input type='password' name='password' id="password" placeholder="Masukkan Password">
       
</label>
<br>
<label for="angka">Angka :
        <input type="number" name="number" id="angka" min="0" max="100" step="10">
        </label>
<br>
        <label for="email">Email :
        <input type="email" name="email" id="email" placeholder="Masukkan Email">
        </label>

<br><label for='tanggal'>Tanggal Lahir :
        <input type="date" name="tanggal" id="tanggal">
        </label>

        <br><label for='warna'>Warna Favorit :
        <input type="color" name="warna" id="warna">
<br>
<button type="submit">Kirim!</button>
    </form>
</body>
</html>
